<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ccplayback</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>▶</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">▶</span>
      <span>ccplayback</span>
    </div>
    <div class="topbar-meta" id="sessionMeta"></div>
  </header>

  <main class="stage">
    <div class="transcript" id="transcript"></div>
    <div class="scroll-anchor" id="scrollAnchor"></div>
  </main>

  <footer class="controls">
    <button id="btnBack" class="ctrl-btn" title="戻る (←)">◀ 戻る</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>
    <button id="btnNext" class="ctrl-btn primary" title="進む (→ / Space)">進む ▶</button>
    <select id="speedSelect" class="speed-select" title="表示速度">
      <option value="1">x1</option>
      <option value="2">x2</option>
      <option value="0">即表示</option>
    </select>
    <button id="btnRestart" class="ctrl-btn ghost" title="最初から">↺ 最初から</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
