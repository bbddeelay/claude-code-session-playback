<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ccplayback</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">▶</span>
      <span>ccplayback</span>
    </div>
    <div class="topbar-meta" id="sessionMeta"></div>
  </header>

  <main class="stage">
    <div class="transcript" id="transcript"></div>
    <div class="scroll-anchor" id="scrollAnchor"></div>
  </main>

  <footer class="controls">
    <button id="btnBack" class="ctrl-btn" title="戻る (←)">◀ 戻る</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>
    <button id="btnNext" class="ctrl-btn primary" title="進む (→ / Space)">進む ▶</button>
    <button id="btnRestart" class="ctrl-btn ghost" title="最初から">↺ 最初から</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
